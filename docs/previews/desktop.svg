    <text x="72" y="271" font-size="15" fill="#627180">Írd le, mi fontos: típus, ár, évjárat vagy extra.</text>
    <circle cx="411" cy="266" r="8" fill="none" stroke="#218fbd" stroke-width="1.8"/>
    <text x="411" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#218fbd">i</text>

