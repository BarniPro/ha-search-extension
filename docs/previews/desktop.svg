<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">HAHU kereső desktop product preview</title>
  <desc id="description">Illustrative desktop mockup of the Hungarian natural-language car search field above the standard Használtautó search filters. This is a product preview, not a browser screenshot.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#25303b" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="660" fill="#f2f5f7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="46" width="5" height="38" rx="2" fill="#ff4200"/>
    <text x="68" y="74" font-size="30" font-weight="700" fill="#25303b">HAHU kereső</text>
    <text x="68" y="104" font-size="17" fill="#627180">Írd le, milyen autót keresel.</text>
    <rect x="888" y="54" width="264" height="34" rx="17" fill="#e5ebef"/>
    <text x="1020" y="76" text-anchor="middle" font-size="12" letter-spacing="1" font-weight="700" fill="#52616e">DESKTOP PREVIEW · MOCKUP</text>

    <rect x="48" y="144" width="1104" height="420" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="72" y="177" width="866" height="65" rx="4" fill="#ffffff" stroke="#b9c2ca" stroke-width="1.5"/>
    <rect x="85" y="166" width="231" height="24" fill="#ffffff"/>
    <text x="93" y="183" font-size="17" font-weight="700" fill="#444444">Milyen autót keresel?</text>
    <text x="92" y="218" font-size="23" fill="#25303b">automata Honda HR-V 7 millióig, 2019-től</text>
    <rect x="954" y="177" width="174" height="65" rx="4" fill="#ff4200"/>
    <path d="M980 197 Q983 206 992 209 Q983 212 980 221 Q977 212 968 209 Q977 206 980 197Z" fill="#ffffff"/>
